<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin dashboard | Tabitha Chicken Company</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css?v=3">
<link rel="stylesheet" href="/assets/admin.css?v=3">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#e3a72f"/><path d="M18 40c0-9 6-15 14-15 3 0 5 1 7 2l8-5-2 9c2 2 3 5 3 9 0 8-7 12-15 12s-15-4-15-12z" fill="#142a1e"/><path d="M24 22c2-5 5-5 6-1 1-4 5-4 5 1z" fill="#142a1e"/><circle cx="40" cy="31" r="1.8" fill="#e3a72f"/></symbol>
</svg>

<!-- ============================ sign in ============================ -->
<div class="login-view" id="loginView" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div>
      <span class="brand" style="color:var(--forest)"><svg aria-hidden="true"><use href="#logo"/></svg>Tabitha Chicken</span>
      <h1 style="font-size:1.7rem;margin-top:1rem">Admin sign in</h1>
      <p class="note" style="margin-top:.35rem">Authorised staff only. Manage orders, products and customers.</p>
    </div>
    <div>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="tcc-feedback" id="loginError" role="alert"></div>
    <button class="btn btn-green" type="submit" style="width:100%">Sign in</button>
    <a class="note" href="/" style="text-align:center">← Back to the website</a>
  </form>
</div>

<!-- ============================ dashboard ============================ -->
<div class="app" id="appView" hidden>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/"><svg aria-hidden="true"><use href="#logo"/></svg><span>Tabitha Chicken<br><small style="font:500 .72rem var(--sans);letter-spacing:.04em;color:#9fb39a">ADMIN</small></span></a>
    <nav aria-label="Dashboard sections">
      <button class="nav-item" data-view="overview" type="button">Overview</button>
      <button class="nav-item" data-view="orders" type="button">Orders</button>
      <button class="nav-item" data-view="payments" type="button">Payments</button>
      <button class="nav-item" data-view="paySettings" type="button">Payment settings</button>
      <button class="nav-item" data-view="products" type="button">Products</button>
      <button class="nav-item" data-view="customers" type="button">Customers</button>
      <button class="nav-item" data-view="reports" type="button">Reports</button>
    </nav>
    <div class="sidebar-foot">
      <a href="/" target="_blank" rel="noopener">View website ↗</a>
      <a href="/track" target="_blank" rel="noopener">Customer tracking page ↗</a>
      <div class="who">
        <strong id="adminName">—</strong>
        <span id="adminRole" class="note">—</span>
      </div>
      <button class="btn btn-line btn-sm" id="logoutBtn" type="button" style="color:#d4ddd0;border-color:rgba(255,255,255,.25)">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
      <h1 id="viewTitle">Overview</h1>
      <span class="note" id="todayLabel"></span>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/admin.js?v=3" defer></script>
</body>
</html>
